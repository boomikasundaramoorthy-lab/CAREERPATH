<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interview Simulator | CAREERPATH</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#16002b,#4b176d,#8e44ad);
    color:white;
    padding-bottom:50px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:rgba(0,0,0,0.18);
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.container{
    width:90%;
    max-width:850px;
    margin:45px auto;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading h1{
    font-size:38px;
    margin-bottom:10px;
}

.heading p{
    color:#eadcff;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:22px;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.question-box{
    background:rgba(255,255,255,0.08);
    padding:22px;
    border-radius:18px;
    margin-bottom:20px;
}

.question-number{
    color:#f5b7d5;
    font-weight:bold;
    margin-bottom:10px;
}

.question{
    font-size:21px;
    line-height:1.5;
}

.btn{
    display:inline-block;
    padding:13px 25px;
    border:none;
    border-radius:25px;
    background:linear-gradient(90deg,#c471ed,#f78fb3);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.result{
    display:none;
    margin-top:25px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
}

.score{
    font-size:40px;
    font-weight:bold;
    margin:10px 0;
}

.feedback{
    color:#eadcff;
    line-height:1.7;
}

.next{
    display:none;
    margin-top:20px;
}

@media(max-width:650px){
    .heading h1{
        font-size:28px;
    }

    nav{
        padding:18px 5%;
    }

    .card{
        padding:22px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">CAREERPATH</div>

    <div>
        <a href="index.html">Home</a>
        <a href="careers.html">Careers</a>
    </div>
</nav>

<div class="container">

    <div class="heading">
        <h1>🎤 Interview Simulator</h1>
        <p>Practice interview questions and improve your confidence.</p>
    </div>

    <div class="card">

        <label for="career">Choose Your Career</label>

        <select id="career">
            <option value="software">Software Developer</option>
            <option value="data">Data Analyst</option>
            <option value="design">UI/UX Designer</option>
            <option value="cyber">Cyber Security</option>
        </select>

        <div class="question-box">

            <div class="question-number">
                Question 1
            </div>

            <div class="question" id="question">
                Tell me about yourself and your technical skills.
            </div>

        </div>

        <label for="answer">
            Your Answer
        </label>

        <textarea
            id="answer"
            placeholder="Type your interview answer here...">
        </textarea>

        <button class="btn" onclick="submitAnswer()">
            Submit Answer
        </button>

        <div class="result" id="result">

            <h2>📊 Interview Feedback</h2>

            <div class="score" id="score">
                80/100
            </div>

            <p class="feedback" id="feedback">
                Good answer! Try to explain your skills
                with a real project example.
            </p>

            <button class="btn next" id="nextBtn" onclick="nextQuestion()">
                Next Question →
            </button>

        </div>

    </div>

</div>

<script>

const questions = {

    software: [
        "Tell me about yourself and your technical skills.",
        "What is Object-Oriented Programming?",
        "Explain one project you have developed.",
        "What is the difference between HTML, CSS and JavaScript?"
    ],

    data: [
        "Tell me about yourself and your interest in data.",
        "What is data analysis?",
        "Which tools are commonly used by Data Analysts?",
        "What is the difference between structured and unstructured data?"
    ],

    design: [
        "Tell me about yourself and your interest in UI/UX.",
        "What is User Experience?",
        "How do you understand user requirements?",
        "What makes a good user interface?"
    ],

    cyber: [
        "Tell me about yourself and your interest in Cyber Security.",
        "What is Cyber Security?",
        "What is phishing?",
        "How can users protect their accounts online?"
    ]

};

let currentQuestion = 0;

document.getElementById("career").addEventListener("change",function(){

    currentQuestion = 0;

    const career = this.value;

    document.getElementById("question").textContent =
        questions[career][currentQuestion];

    document.querySelector(".question-number").textContent =
        "Question 1";

    document.getElementById("result").style.display = "none";

    document.getElementById("answer").value = "";

});

function submitAnswer(){

    const answer =
        document.getElementById("answer").value.trim();

    if(answer === ""){
        alert("Please type your answer first.");
        return;
    }

    let score = 60;

    if(answer.length > 80){
        score = 80;
    }

    if(answer.length > 150){
        score = 90;
    }

    document.getElementById("score").textContent =
        score + "/100";

    if(score >= 90){

        document.getElementById("feedback").textContent =
            "Excellent answer! 🌟 Your answer is detailed and well explained. Try adding a real project example to make it even stronger.";

    }
    else if(score >= 80){

        document.getElementById("feedback").textContent =
            "Good answer! 👍 Try to explain your answer with a real-world example.";

    }
    else{

        document.getElementById("feedback").textContent =
            "Your answer needs more detail. Try explaining your skills, knowledge and examples clearly.";

    }

    document.getElementById("result").style.display =
        "block";

    document.getElementById("nextBtn").style.display =
        "inline-block";
}

function nextQuestion(){

    const career =
        document.getElementById("career").value;

    currentQuestion++;

    if(currentQuestion >= questions[career].length){

        document.getElementById("question").textContent =
            "🎉 Interview completed!";

        document.querySelector(".question-number").textContent =
            "Completed";

        document.getElementById("answer").value = "";

        document.getElementById("result").style.display =
            "block";

        document.getElementById("feedback").textContent =
            "Great job! Keep practicing regularly to improve your interview confidence.";

        document.getElementById("nextBtn").style.display =
            "none";

        return;
    }

    document.getElementById("question").textContent =
        questions[career][currentQuestion];

    document.querySelector(".question-number").textContent =
        "Question " + (currentQuestion + 1);

    document.getElementById("answer").value = "";

    document.getElementById("result").style.display =
        "none";
}

</script>

</body>
</html>
